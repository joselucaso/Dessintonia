<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sintonia Web</title>
    <link rel="stylesheet" href="css/style.css?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-effects">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>
    
    <div class="game-wrapper">
        <div class="team-scores">
            <div class="team-score purple" id="score-team-1">
                <span class="label">Time A</span>
                <span class="value">0</span>
            </div>
            <div class="team-score turquoise" id="score-team-2">
                <span class="label">Time B</span>
                <span class="value">0</span>
            </div>
        </div>

        <main class="game-container glass-panel">
            <section class="card-section">
                <div class="concept left-concept" id="left-concept">...</div>
                <div class="vs-badge">VS</div>
                <div class="concept right-concept" id="right-concept">...</div>
            </section>

        <section class="dial-section">
            <button class="btn-refresh" id="btn-next" title="Nova Rodada">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                </svg>
            </button>
            <div class="dial-wrapper">
                <svg viewBox="0 0 400 220" class="dial-svg" id="dial-svg">
                    <defs>
                        <!-- Glow filter for the marker -->
                        <filter id="glow">
                            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                        <!-- Gradient for the screen -->
                        <linearGradient id="screen-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#1e1e28"/>
                            <stop offset="50%" stop-color="#2a2a35"/>
                            <stop offset="100%" stop-color="#1e1e28"/>
                        </linearGradient>
                    </defs>
                    
                    <!-- Background Arc (The full spectrum) -->
                    <path class="dial-bg" d="M 60 180 A 140 140 0 0 1 340 180" fill="none" stroke-width="40" stroke-linecap="butt" />
                    

                    
                    <!-- Target Area Slices (Generated by JS) -->
                    <g id="target-group"></g>
                    
                    <!-- Ruler Scale Markings -->
                    <g id="scale-group"></g>
                    
                    <!-- The Screen (Anteparo) -->
                    <path id="screen-path" class="screen-door" d="M 60 180 A 140 140 0 0 1 340 180" fill="none" stroke="url(#screen-grad)" stroke-width="44" stroke-linecap="butt" />
                    
                    <!-- Marker Needle (The main Guess) -->
                    <g id="marker-group" class="draggable">
                        <!-- Red main pointer -->
                        <line class="marker-line-main" x1="200" y1="180" x2="200" y2="30" stroke-linecap="round"/>
                        <circle class="marker-pivot" cx="200" cy="180" r="12" />
                        <circle cx="200" cy="30" r="15" fill="transparent" class="marker-handle"/>
                    </g>

                    <!-- Opponent Guess Pointer (Left/Right) -->
                    <g id="opponent-guess-group" style="display: none;">
                        <path id="opponent-arrow" d="M 200 60 L 185 80 L 215 80 Z" fill="var(--color-orange)" filter="url(#glow)" />
                    </g>

                    <!-- Center Arrow Marker (Above everything) -->
                    <path d="M 194 15 L 206 15 L 200 25 Z" fill="#ff3b3b" style="pointer-events: none;" />
                </svg>
            </div>
            
            <div class="score-display" id="score-display">
                <span class="score-value">0</span> PONTOS
            </div>
            <p class="feedback-text" id="feedback-text"></p>
        </section>

        <section class="controls">
            <div class="main-controls">
                <div class="primary-btns">
                    <button class="btn btn-secondary" id="btn-peek">Espiar</button>
                    <button class="btn btn-primary" id="btn-reveal">Revelar</button>
                </div>
            </div>
            
            <div class="opponent-controls" id="opponent-controls">
                <p class="control-label">O Alvo está para qual lado do ponteiro?</p>
                <div class="btn-group">
                    <button class="btn btn-small" id="btn-guess-left">
                        <span class="arrow">←</span>
                        <span class="text">Esquerda</span>
                    </button>
                    <button class="btn btn-small" id="btn-guess-right">
                        <span class="arrow">→</span>
                        <span class="text">Direita</span>
                    </button>
                </div>
            </div>
        </section>
    </main>

    </div>

    <script src="js/app.js"></script>
</body>
</html>
